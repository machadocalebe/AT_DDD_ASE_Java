server:
  port: 8082
spring:
  application:
    name: notificacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificacao_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notificacao-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 3          # até 3 threads, uma por partição: contratos distintos em paralelo, mesma partição em ordem
      observation-enabled: true
    template:
      observation-enabled: true
app:
  kafka:
    topic: contratos.eventos.v1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level service=${spring.application.name} traceId=%X{traceId:-} correlationId=%X{correlationId:-} thread=%thread logger=%logger{36} - %msg%n"
  level:
    root: INFO
    br.com.freela: INFO
